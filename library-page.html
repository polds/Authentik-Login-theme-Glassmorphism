  <script data-id="theme-script">
    "use strict";

    (function () {
        try {
            /* Ignore older theme names */
            let locallyStoredTheme = window.localStorage?.getItem("theme") || null;
            if (typeof locallyStoredTheme === "string") {
                locallyStoredTheme = locallyStoredTheme.trim();
            }
            if (!(["auto", "light", "dark"].includes(locallyStoredTheme))) {
                locallyStoredTheme = null;
            }
            
            const initialThemeChoice =
                new URLSearchParams(window.location.search).get("theme") || locallyStoredTheme;

            const themeChoice =
                initialThemeChoice || document.documentElement.dataset.themeChoice || "auto";

            document.documentElement.dataset.themeChoice = themeChoice;

            if (themeChoice === "auto") {
                document.documentElement.dataset.theme = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches
                    ? "dark"
                    : "light";
            } else {
                document.documentElement.dataset.theme = themeChoice;
            }
        } catch (e) {
            console.error("Failed to apply theme", e);
        }
    })();
  </script>

th: 100%\u003B\u005Cn    height: 100%\u003B\u005Cn    background: linear\u002Dgradient(90deg,\u005Cn            transparent 0%,\u005Cn            rgba(255, 255, 255, 0.15) 50%,\u005Cn            transparent 100%)\u003B\u005Cn    transition: left 0.6s ease\u003B\u005Cn    z\u002Dindex: 1\u003B\u005Cn    border\u002Dradius: 14px\u003B\u005Cn}\u005Cn\u005Cn:host(ak\u002Dstage\u002Duser\u002Dlogin) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary:hover::before,\u005Cn:host(ak\u002Dstage\u002Didentification) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary:hover::before {\u005Cn    left: 100%\u003B\u005Cn}\u005Cn\u005Cn:host(ak\u002Dstage\u002Duser\u002Dlogin) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary:hover,\u005Cn:host(ak\u002Dstage\u002Didentification) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary:hover {\u005Cn    background: rgba(220, 53, 69, 0.25) !important\u003B\u005Cn    border\u002Dcolor: rgba(220, 53, 69, 0.45) !important\u003B\u005Cn    color: white !important\u003B\u005Cn    transform: translateY(\u002D1px) !important\u003B\u005Cn    box\u002Dshadow:\u005Cn        0 8px 25px rgba(220, 53, 69, 0.2),\u005Cn        0 4px 12px rgba(0, 0, 0, 0.15),\u005Cn        inset 0 1px 0 rgba(255, 255, 255, 0.15) !important\u003B\u005Cn}\u005Cn\u005Cn/* Z\u002Dindex fix for text */\u005Cn:host(ak\u002Dstage\u002Duser\u002Dlogin) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dprimary *,\u005Cn:host(ak\u002Dstage\u002Duser\u002Dlogin) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary *,\u005Cn:host(ak\u002Dstage\u002Didentification) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dprimary *,\u005Cn:host(ak\u002Dstage\u002Didentification) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary * {\u005Cn    position: relative !important\u003B\u005Cn    z\u002Dindex: 2 !important\u003B\u005Cn}\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003 005Cn    background\u002Dimage: var(\u002D\u002Dak\u002Dflow\u002Dbackground) !important\u003B\u005Cn    background\u002Dsize: cover !important\u003B\u005Cn    background\u002Dposition: center !important\u003B\u005Cn    background\u002Drepeat: no\u002Drepeat !important\u003B\u005Cn    background\u002Dattachment: fixed !important\u003B\u005Cn}\u005Cn\u005Cn/* HIJACK ADMIN PANEL: Remove background image in admin interface */\u005Cn:host(ak\u002Dinterface\u002Dadmin) .pf\u002Dc\u002Dpage {\u005Cn    background\u002Dimage: none !important\u003B\u005Cn    background\u002Dcolor: var(\u002D\u002Dpf\u002Dglobal\u002D\u002DBackgroundColor\u002D\u002D100) !important\u003B\u005Cn}\u005Cn\u005Cn/* DASHBOARD TRANSPARENCY FIX */\u005Cn/* Force variables to transparent inside the library/dashboard host AND user interface wrapper */\u005Cn:host(ak\u002Dlibrary\u002Dimpl),\u005Cn:host(ak\u002Dinterface\u002Duser) {\u005Cn    \u002D\u002Dpf\u002Dglobal\u002D\u002DBackgroundColor\u002D\u002D100: transparent !important\u003B\u005Cn    \u002D\u002Dpf\u002Dc\u002Dpage\u002D\u002DBackgroundColor: transparent !important\u003B\u005Cn    \u002D\u002Dpf\u002Dc\u002Dpage__main\u002Dsection\u002D\u002DBackgroundColor: transparent !important\u003B\u005Cn}\u005Cn\u005Cn/* DASHBOARD TRANSPARENCY FIX */\u005Cn/* Force variables to transparent inside the library/dashboard host AND user interface wrapper */\u005Cn:host(ak\u002Dlibrary\u002Dimpl),\u005Cn:host(ak\u002Dinterface\u002Duser) {\u005Cn    \u002D\u002Dpf\u002Dglobal\u002D\u002DBackgroundColor\u002D\u002D100: transparent !important\u003B\u005Cn    \u002D\u002Dpf\u002Dc\u002Dpage\u002D\u002DBackgroundColor: transparent !important\u003B\u005Cn    \u002D\u002Dpf\u002Dc\u002Dpage__main\u002Dsection\u002D\u002DBackgroundColor: transparent !important\u003B\u005Cn}\u005Cn\u005Cn/* Force specific containers to be transparent in dashboard */\u005Cn:host(ak\u002Dlibrary\u002Dimpl) .pf\u002Dc\u002Dpage,\u005Cn:host(ak\u002Dlibrary\u002Dimpl) .pf\u002Dc\u002Dpage__main,\u005Cn:host(ak\u002Dlibrary\u002Dimpl) .pf\u002Dc\u002Dpage__main\u002Dsection,\u005Cn:host(ak\u002Dlibrary\u002Dimpl) .pf\u002Dc\u002Ddrawer__content,\u005Cn:host(ak\u002Dlibrary\u002Dimpl) .pf\u002Dc\u002Ddrawer__main,\u005Cn:host(ak\u002Dinterface\u002Duser) .pf\u002Dc\u002Dpage,\u005Cn:host(ak\u002Dinterface\u002Duser) .pf\u002Dc\u002Dpage__main {\u005Cn    background: transparent !important\u003B\u005Cn    background\u002Dcolor: transparent !important\u003B\u005Cn}\u005Cn\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D */\u005Cn/* \u003D\u003D\u003D FORM INPUTS \u0026 PASSWORD TOGGLE FIX \u003D\u003D\u003D */\u005Cn/* \u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D\u003D */\u005Cn\u005Cn/* Fix Input Group Position to allow absolute button */\u005Cn.pf\u002Dc\u002Dinput\u002Dgroup {\u005Cn    position: relative !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    width: 100% !important\u003B\u005Cn}\u005Cn\u005Cn/* Position the \u005C\u0022Show Password\u005C\u0022 button inside the input */\u005Cn.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dcontrol {\u005Cn    position: absolute !important\u003B\u005Cn    top: 50% !important\u003B\u005Cn    right: 5px !important\u003B\u005Cn    transform: translateY(\u002D50%) !important\u003B\u005Cn    background: transparent !important\u003B\u005Cn    border: none !important\u003B\u005Cn    box\u002Dshadow: none !important\u003B\u005Cn    /* Very high z\u002Dindex to stay above focused inputs */\u005Cn    z\u002Dindex: 9999 !important\u003B\u005Cn    padding: 5px !important\u003B\u005Cn    margin: 0 !important\u003B\u005Cn    height: auto !important\u003B\u005Cn    min\u002Dwidth: 0 !important\u003B\u005Cn    width: 30px !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn    cursor: pointer !important\u003B\u005Cn    pointer\u002Devents: auto !important\u003B\u005Cn}\u005Cn\u005Cn/* Hover effect */\u005Cn.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dcontrol:hover {\u005Cn    background: rgba(255, 255, 255, 0.1) !important\u003B\u005Cn    border\u002Dradius: 50% !important\u003B\u005Cn}\u005Cn\u005Cn/* Remove borders */\u005Cn.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dcontrol::after,\u005Cn.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dcontrol::before {\u005Cn    display: none !important\u003B\u005Cn    content: none !important\u003B\u005Cn}\u005Cn\u005Cn/* Ensure input has space */\u005Cn.pf\u002Dc\u002Dform\u002Dcontrol {\u005Cn    padding\u002Dright: 40px !important\u003B\u005Cn}\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D ADMIN INTERFACE PRESERVATION \u003D\u003D\u003D\u003D\u003D */\u005Cn/* Reset sensitive admin elements to avoid breaking them */\u005Cn\u005Cn[data\u002Dak\u002Dinterface\u002Droot\u003D\u005C\u0022ak\u002Dinterface\u002Dadmin\u005C\u0022] .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dplain,\u005Cn[data\u002Dak\u002Dinterface\u002Droot\u003D\u005C\u0022ak\u002Dinterface\u002Dadmin\u005C\u0022] .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary,\u005Cn[data\u002Dak\u002Dinterface\u002Droot\u003D\u005C\u0022ak\u002Dinterface\u002Dadmin\u005C\u0022] .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dprimary {\u005Cn    width: auto !important\u003B\u005Cn    min\u002Dwidth: 0 !important\u003B\u005Cn    height: auto !important\u003B\u005Cn    transform: none !important\u003B\u005Cn    background: var(\u002D\u002Dpf\u002Dc\u002Dbutton\u002D\u002Dm\u002Dplain\u002D\u002DBackgroundColor, transparent) !important\u003B\u005Cn    border: none !important\u003B\u005Cn    box\u002Dshadow: none !important\u003B\u005Cn    color: var(\u002D\u002Dpf\u002Dc\u002Dbutton\u002D\u002Dm\u002Dplain\u002D\u002DColor, inherit) !important\u003B\u005Cn}\u005Cn\u005Cn[data\u002Dak\u002Dinterface\u002Droot\u003D\u005C\u0022ak\u002Dinterface\u002Dadmin\u005C\u0022] .pf\u002Dc\u002Dselect__toggle,\u005Cn[data\u002Dak\u002Dinterface\u002Droot\u003D\u005C\u0022ak\u002Dinterface\u002Dadmin\u005C\u0022] .pf\u002Dc\u002Dform\u002Dcontrol {\u005Cn    height: auto !important\u003B\u005Cn    min\u002Dheight: 0 !important\u003B\u005Cn    padding: initial !important\u003B\u005Cn    background: var(\u002D\u002Dpf\u002Dc\u002Dform\u002Dcontrol\u002D\u002DBackgroundColor, #fff) !important\u003B\u005Cn    border: 1px solid var(\u002D\u002Dpf\u002Dc\u002Dform\u002Dcontrol\u002D\u002DBorderColor, #ccc) !important\u003B\u005Cn    border\u002Dradius: var(\u002D\u002Dpf\u002Dc\u002Dform\u002Dcontrol\u002D\u002DBorderRadius, 3px) !important\u003B\u005Cn    backdrop\u002Dfilter: none !important\u003B\u005Cn    box\u002Dshadow: none !important\u003B\u005Cn    color: var(\u002D\u002Dpf\u002Dc\u002Dform\u002Dcontrol\u002D\u002DColor, initial) !important\u003B\u005Cn}\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D ADMIN BUTTON STYLING \u003D\u003D\u003D\u003D\u003D */\u005Cn\u005Cn:host(ak\u002Dinterface\u002Duser) a[href*\u003D\u005C\u0022/if/admin/\u005C\u0022],\u005Cn:host(ak\u002Dinterface\u002Duser\u002Dpresentation) a[href*\u003D\u005C\u0022/if/admin/\u005C\u0022],\u005Cn:host(ak\u002Dinterface\u002Duser) .pf\u002Dc\u002Dpage__header\u002Dtools\u002Ditem a.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary,\u005Cn:host(ak\u002Dinterface\u002Duser\u002Dpresentation) .pf\u002Dc\u002Dpage__header\u002Dtools\u002Ditem a.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary {\u005Cn    border\u002Dradius: 50px !important\u003B\u005Cn    border: none !important\u003B\u005Cn    background: rgba(255, 255, 255, 0.15) !important\u003B\u005Cn    backdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    \u002Dwebkit\u002Dbackdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    color: white !important\u003B\u005Cn    padding: 8px 24px !important\u003B\u005Cn    transition: all 0.3s ease !important\u003B\u005Cn    box\u002Dshadow: 0 4px 15px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important\u003B\u005Cn    text\u002Dtransform: none !important\u003B\u005Cn    font\u002Dweight: 500 !important\u003B\u005Cn}\u005Cn\u005Cn/* Button \u0027Yes\u0027 / Primary */\u005Cn:host(ak\u002Dstage\u002Didentification) .pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dprimary {\u005Cn    background: rgba(40, 167, 69, 0.25) !important\u003B\u005Cn    backdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    \u002Dwebkit\u002Dbackdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    border: 1.5px solid rgba(40, 167, 69, 0.4) !important\u003B\u005Cn    color: white !important\u003B\u005Cn    font\u002Dweight: 600 !important\u003B\u005Cn    padding: 10px 24px !important\u003B\u005Cn    border\u002Dradius: 14px !important\u003B\u005Cn    transition: all 0.4s cubic\u002Dbezier(0.175, 0.885, 0.32, 1.275) !important\u003B\u005Cn    box\u002Dshadow:\u005Cn        0 4px 15px rgba(40, 167, 69, 0.15),\u005Cn        0 2px 8px rgba(0, 0, 0, 0.1),\u005Cn        inset 0 1px 0 rgba(255, 255, 255, 0.15) !important\u003B\u005Cn    position: relative !important\u003B\u005Cn    overflow: hidden !important\u003B\u005Cn    margin\u002Dtop: 4px !important\u003B\u005Cn    /* Fix for hover clipping */\u005Cn    margin\u002Dbottom: 4px !important\u003B\u005Cn}\u005Cn\u005Cn:host(ak\u002Dinterface\u002Duser) a[href*\u003D\u005C\u0022/if/admin/\u005C\u0022]:hover,\u005Cn:host(ak\u002Dinterface\u002Duser\u002Dpresentation) a[href*\u003D\u005C\u0022/if/admin/\u005C\u0022]:hover,\u005Cn:host(ak\u002Dinterface\u002Duser) .pf\u002Dc\u002Dpage__header\u002Dtools\u002Ditem a.pf\u002Dc\u002Dbutton.pf\u002Dm\u002Dsecondary:hover,\u005Cn:host(ak\u002Dinterface\u002Duser\u002Dpresentation) .pf\u002Dc\u portant\u003B\u005Cn    position: relative !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn    /* Ensure separator is full width on top */\u005Cn    flex\u002Dwrap: wrap !important\u003B\u005Cn}\u005Cn\u005Cn/* Custom CSS\u002Donly Separator \u005C\u0022Ou\u005C\u0022 */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks::before {\u005Cn    content: var(\u002D\u002Dak\u002Dsocial\u002Dseparator\u002Dtext) !important\u003B\u005Cn    display: block !important\u003B\u005Cn    width: 100% !important\u003B\u005Cn    text\u002Dalign: center !important\u003B\u005Cn    font\u002Dsize: 15px !important\u003B\u005Cn    color: #ffffff !important\u003B\u005Cn    opacity: 1 !important\u003B\u005Cn    margin\u002Dbottom: 20px !important\u003B\u005Cn    margin\u002Dtop: 10px !important\u003B\u005Cn    font\u002Dweight: 400 !important\u003B\u005Cn\u005Cn    /* The Line Trick: Solid White \u0026 Balanced Gap for \u005C\u0022Continuer avec\u005C\u0022 */\u005Cn    background: linear\u002Dgradient(to right,\u005Cn            rgba(255, 255, 255, 1) 0%,\u005Cn            rgba(255, 255, 255, 1) 32%,\u005Cn            transparent 32%,\u005Cn            transparent 68%,\u005Cn            rgba(255, 255, 255, 1) 68%,\u005Cn            rgba(255, 255, 255, 1) 100%) !important\u003B\u005Cn    background\u002Dsize: 100% 1px !important\u003B\u005Cn    background\u002Dposition: center !important\u003B\u005Cn    background\u002Drepeat: no\u002Drepeat !important\u003B\u005Cn}\u005Cn\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink {\u005Cn    background: rgba(255, 255, 255, 0.08) !important\u003B\u005Cn    border: 1px solid rgba(255, 255, 255, 0.2) !important\u003B\u005Cn    color: white !important\u003B\u005Cn    border\u002Dradius: 12px !important\u003B\u005Cn    padding: 10px 20px !important\u003B\u005Cn    transition: all 0.3s ease !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn    text\u002Ddecoration: none !important\u003B\u005Cn    box\u002Dshadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important\u003B\u005Cn}\u005Cn\u005Cn/* Resize the icon (FontAwesome or SVG) */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink i,\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink svg {\u005Cn    /* Revert to slightly larger icon since text is gone */\u005Cn    font\u002Dsize: 24px !important\u003B\u005Cn    width: 24px !important\u003B\u005Cn    height: 24px !important\u003B\u005Cn    text\u002Dalign: center !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn}\u005Cn\u005Cn/* If no match found, fallback to aria\u002Dlabel or just blank */\u005Cncontent: attr(aria\u002Dlabel)\u003B\u005Cnfont\u002Dsize: 14px !important\u003B\u005Cnfont\u002Dweight: 500 !important\u003B\u005Cncolor: rgba(255, 255, 255, 0.9) !important\u003B\u005Cnwhite\u002Dspace: nowrap !important\u003B\u005Cndisplay: block !important\u003B\u005Cntext\u002Dtransform: capitalize !important\u003B\u005Cn}\u005Cn\u005Cn/* Ensure nice casing */\u005Cn}\u005Cn\u005Cn/* Resize the icon (FontAwesome or SVG) */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink i,\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink svg {\u005Cn    font\u002Dsize: 18px !important\u003B\u005Cn    /* Reduce specific icon size */\u005Cn    width: 18px !important\u003B\u005Cn    height: 18px !important\u003B\u005Cn    text\u002Dalign: center !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn}\u005Cn\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink:hover {\u005Cn    background: rgba(255, 255, 255, 0.2) !important\u003B\u005Cn    transform: translateY(\u002D2px) !important\u003B\u005Cn    box\u002Dshadow: 0 8px 15px rgba(0, 0, 0, 0.2) !important\u003B\u005Cn    border\u002Dcolor: rgba(255, 255, 255, 0.4) !important\u003B\u005Cn}\u005Cn\u005Cn/* Ensure no default underlined link style */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink:active,\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink:visited {\u005Cn    color: white !important\u003B\u005Cn    text\u002Ddecoration: none !important\u003B\u005Cn}\u005Cn\u005Cn/* Specific fix for images inside social buttons */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem\u002Dlink img {\u005Cn    margin\u002Dright: 8px !important\u003B\u005Cn    max\u002Dheight: 20px !important\u003B\u005Cn}\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D SOCIAL BUTTONS IN FOOTER (Discord, Google, etc.) \u003D\u003D\u003D\u003D\u003D */\u005Cn/* Horizontal layout with white glassmorphism matching login button */\u005Cn\u005Cn/* Container for horizontal layout */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks {\u005Cn    display: flex !important\u003B\u005Cn    flex\u002Ddirection: row !important\u003B\u005Cn    flex\u002Dwrap: wrap !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    gap: 12px !important\u003B\u005Cn    margin\u002Dtop: 10px !important\u003B\u005Cn}\u005Cn\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem {\u005Cn    display: inline\u002Dflex !important\u003B\u005Cn    width: auto !important\u003B\u005Cn}\u005Cn\u005Cn\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button {\u005Cn    background: rgba(255, 255, 255, 0.15) !important\u003B\u005Cn    backdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    \u002Dwebkit\u002Dbackdrop\u002Dfilter: blur(10px) !important\u003B\u005Cn    border: 1px solid rgba(255, 255, 255, 0.3) !important\u003B\u005Cn    color: white !important\u003B\u005Cn    font\u002Dweight: 600 !important\u003B\u005Cn    border\u002Dradius: 12px !important\u003B\u005Cn    padding: 10px 16px !important\u003B\u005Cn    font\u002Dsize: 14px !important\u003B\u005Cn    display: flex !important\u003B\u005Cn    align\u002Ditems: center !important\u003B\u005Cn    justify\u002Dcontent: center !important\u003B\u005Cn    gap: 6px !important\u003B\u005Cn    min\u002Dwidth: 100px !important\u003B\u005Cn    max\u002Dwidth: 120px !important\u003B\u005Cn    height: auto !important\u003B\u005Cn    transition: all 0.3s ease !important\u003B\u005Cn    box\u002Dshadow: 0 6px 20px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(255, 255, 255, 0.1) !important\u003B\u005Cn    position: relative\u003B\u005Cn    overflow: hidden\u003B\u005Cn    margin: 0 !important\u003B\u005Cn    flex: 0 0 auto !important\u003B\u005Cn}\u005Cn\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button img {\u005Cn    width: 18px !important\u003B\u005Cn    height: 18px !important\u003B\u005Cn    margin\u002Dright: 0 !important\u003B\u005Cn    flex\u002Dshrink: 0\u003B\u005Cn    display: inline\u002Dblock\u003B\u005Cn}\u005Cn\u005Cn/* Remove specific Discord/Google colors \u002D use white glassmorphism for all */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button:has(img[src*\u003D\u005C\u0022discord\u005C\u0022]),\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button:has(img[src*\u003D\u005C\u0022google\u005C\u0022]) {\u005Cn    background: rgba(255, 255, 255, 0.15) !important\u003B\u005Cn    border\u002Dcolor: rgba(255, 255, 255, 0.3) !important\u003B\u005Cn}\u005Cn\u005Cn/* Make Discord icon white */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button:has(img[src*\u003D\u005C\u0022discord\u005C\u0022]) img {\u005Cn    filter: brightness(0) invert(1)\u003B\u005Cn}\u005Cn\u005Cn/* Hover effect \u002D identical to login button */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks\u002Ditem button:hover {\u005Cn    background: rgba(255, 255, 255, 0.25) !important\u003B\u005Cn    border\u002Dcolor: rgba(255, 255, 255, 0.4) !important\u003B\u005Cn    transform: translateY(\u002D2px) !important\u003B\u005Cn    box\u002Dshadow: 0 10px 30px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(255, 255, 255, 0.15) !important\u003B\u005Cn    cursor: pointer\u003B\u005Cn}\u005Cn\u005Cn/* Separator \u005C\u0022ou\u005C\u0022 above buttons */\u005Cn.pf\u002Dc\u002Dlogin__main\u002Dfooter\u002Dlinks::before {\u005Cn    content: \u005C\u0022\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500  ou  \u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005Cu2500\u005C\u0022\u003B\u005Cn    display: block\u003B\u005Cn    width: 100%\u003B\u005Cn    color: #b8bbc2\u003B\u005Cn    text\u002Dalign: center\u003B\u005Cn    font\u002Dsize: 14px\u003B\u005Cn    font\u002Dweight: 500\u003B\u005Cn    margin: 10px 0 15px 0\u003B\u005Cn    letter\u002Dspacing: 0.4px\u003B\u005Cn    opacity: 0.8\u003B\u005Cn}\u005Cn\u005Cn/* \u003D\u003D\u003D\u003D\u003D RESPONSIVE MOBILE \u003D\u003D\u003D\u003D\u003D */\u005Cn@media (max\u002Dwidth: 768px) {\u005Cn\u005Cn    /* Force le background de la page sur mobile */\u005Cn    .pf\u002Dc\u002Dpage,\u005Cn    body,\u005Cn    .pf\u002Dc\u002Dlogin .pf\u002Dc\u002Dpage,\u005Cn    body:has(.pf\u002Dc\u002Dlogin) .pf\u002Dc\u002Dpage {\u005Cn        background: transparent !important\u003B\u005Cn        background\u002Dcolor: transparent !important\u003B\u005Cn        position: fixed !important\u003B\u005Cn        top: 0 !important\u003B\u005Cn        left: 0 !important\u003B\u005Cn        right: 0 !important\u003B\u005Cn        bottom: 0 !important\u003B\u005Cn        width: 100vw !important\u003B\u005Cn        height: 100vh !important\u003B\u005Cn        margin: 0 !important\u003B\u005Cn
